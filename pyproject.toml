[build-system]
build-backend = "poetry.core.masonry.api"
requires = [ "poetry-core" ]

[tool.poetry]
name = "pathlibutil"
version = "0.0.0"
description = "inherits from pathlib.Path with methods for hashing, copying, deleting and more"
license = "MIT"
authors = [ "Christoph Dörrer <d-chris@web.de>" ]
readme = "README.md"
keywords = [ "hashlib", "json", "pathlib", "shutil", "urllib.parse", "urlpath" ]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[tool.poetry.dependencies]
python = "^3.8"
py7zr = { version = ">=0.20.2", optional = true }
typing-extensions = ">=4.13.2"

[tool.poetry.group.docs.dependencies]
jinja2-pdoc = { version = "^1.3.0", python = ">=3.8.1" }
pyperclip = "^1.9.0"

[tool.poetry.group.test.dependencies]
exrex = ">=0.12.0"
pytest = ">=8.3.3"
pytest-cov = ">=4.1.0"
pytest-mock = ">=3.12.0"
pytest-random-order = ">=1.1.0"

[tool.poetry.extras]
7z = [ "py7zr" ]

[tool.poetry.urls]
documentation = "https://d-chris.github.io/pathlibutil"
repository = "https://github.com/d-chris/pathlibutil"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[[tool.poetry.source]]
name = "testpypi"
url = "https://test.pypi.org/legacy/"
priority = "explicit"

[tool.isort]
profile = "black"

[tool.pyproject-fmt]
expand_tables = [ "tool.poetry" ]
tool_format = "short"

[tool.pytest]
ini_options.minversion = "6.0"
ini_options.testpaths = "tests"
ini_options.addopts = [
  "--random-order",
  "--color=yes",
  "-s",
  "--cov=pathlibutil",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=xml",
]

[tool.coverage]
run.omit = [
  "*/docs/*",
  "*/examples/*",
  "*/tests/*",
]
report.exclude_lines = [
  "^def normalize_url",
]
