[tox]
requires =
    tox>=4.2
env_list =
    py3{15, 14, 13, 12, 11, 10, 9, 8}{, -7z}
no_package = true

[testenv]
skip_install = true
set_env =
    COVERAGE_FILE = {env_dir}/.coverage
commands_pre =
    poetry install --sync --no-interaction --only main,test
commands =
    poetry run pytest -v
allowlist_externals =
    poetry

[testenv:py*-7z]
commands_pre =
    poetry install --sync --no-interaction --only main,test --extras 7z
